# Local development stack (Laravel Sail style) for omnibus-uniges.
# Infra-as-code (Law 3). Ports are remapped to avoid clashing with other OMNIBUS
# Sail stacks running on the same host (e.g. omnibus-cms). Production uses
# docker-compose.prod.yml instead.
services:
  laravel.test:
    build:
      context: './vendor/laravel/sail/runtimes/8.5'
      dockerfile: Dockerfile
      args:
        WWWGROUP: '${WWWGROUP:-1000}'
    image: sail-8.5/app
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${APP_PORT:-8090}:80'
      - '${VITE_PORT:-5174}:${VITE_PORT:-5174}'
      - '${REVERB_PORT:-8081}:8081'
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
      IGNITION_LOCAL_SITES_PATH: '${PWD}'
    volumes:
      - '.:/var/www/html'
    networks:
      - sail
    depends_on:
      - pgsql
      - valkey

  pgsql:
    image: 'postgres:18-alpine'
    ports:
      - '${FORWARD_DB_PORT:-5434}:5432'
    environment:
      PGPASSWORD: '${DB_PASSWORD:-secret}'
      POSTGRES_DB: '${DB_DATABASE:-uniges}'
      POSTGRES_USER: '${DB_USERNAME:-uniges}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
    volumes:
      - 'sail-pgsql:/var/lib/postgresql/data'
      - './docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
    networks:
      - sail
    healthcheck:
      test:
        - CMD
        - pg_isready
        - '-q'
        - '-d'
        - '${DB_DATABASE:-uniges}'
        - '-U'
        - '${DB_USERNAME:-uniges}'
      retries: 3
      timeout: 5s

  valkey:
    image: 'valkey/valkey:8-alpine'
    ports:
      - '${FORWARD_REDIS_PORT:-6381}:6379'
    volumes:
      - 'sail-valkey:/data'
    networks:
      - sail
    healthcheck:
      test:
        - CMD
        - valkey-cli
        - ping
      retries: 3
      timeout: 5s

networks:
  sail:
    driver: bridge

volumes:
  sail-pgsql:
    driver: local
  sail-valkey:
    driver: local
