# ==============================================================================
# UNIGES — Production Docker Compose
# ==============================================================================
# Stack: PHP 8.5 + Laravel 12 + PostgreSQL 18 + Valkey 8.0 + Laravel Reverb
# Routing: Traefik v3.3 with Let's Encrypt TLS
# Domain: titulacion.carlosgardea.com
# ==============================================================================

services:
  # --------------------------------------------------------------------------
  # Application (PHP-FPM + Laravel + Inertia/React precompiled)
  # --------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: omnibus-uniges-app
    restart: unless-stopped
    env_file: .env
    volumes:
      - app-storage:/var/www/html/storage/app
      - app-logs:/var/www/html/storage/logs
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - web
      - internal
    labels:
      # Traefik v3 routing
      - "traefik.enable=true"

      # HTTPS router
      - "traefik.http.routers.uniges.rule=Host(`titulacion.carlosgardea.com`)"
      - "traefik.http.routers.uniges.entrypoints=websecure"
      - "traefik.http.routers.uniges.tls=true"
      - "traefik.http.routers.uniges.tls.certresolver=letsencrypt"
      - "traefik.http.routers.uniges.middlewares=uniges-headers@docker"

      # HTTP → HTTPS redirect
      - "traefik.http.routers.uniges-http.rule=Host(`titulacion.carlosgardea.com`)"
      - "traefik.http.routers.uniges-http.entrypoints=web"
      - "traefik.http.routers.uniges-http.middlewares=https-redirect@docker"

      # Load balancer target
      - "traefik.http.services.uniges.loadbalancer.server.port=8000"
      - "traefik.http.services.uniges.loadbalancer.healthcheck.path=/up"
      - "traefik.http.services.uniges.loadbalancer.healthcheck.interval=10s"

      # Security headers middleware
      - "traefik.http.middlewares.uniges-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.uniges-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.uniges-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.uniges-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.uniges-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.uniges-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.uniges-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.uniges-headers.headers.referrerPolicy=strict-origin-when-cross-origin"

      # HTTPS redirect middleware
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"

  # --------------------------------------------------------------------------
  # PostgreSQL 18
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: omnibus-uniges-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: uniges
      POSTGRES_USER: uniges
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniges -d uniges"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal
      - global_data_private
    deploy:
      resources:
        limits:
          memory: 512M

  # --------------------------------------------------------------------------
  # Valkey 8.0 (Queues + Cache + Sessions)
  # --------------------------------------------------------------------------
  valkey:
    image: valkey/valkey:8.0-alpine
    container_name: omnibus-uniges-valkey
    restart: unless-stopped
    command: >
      valkey-server
        --maxmemory 128mb
        --maxmemory-policy allkeys-lru
        --appendonly yes
        --appendfsync everysec
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 192M

  # --------------------------------------------------------------------------
  # Laravel Reverb (WebSocket Server — Real-Time Graduation Status)
  # --------------------------------------------------------------------------
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: omnibus-uniges-reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    env_file: .env
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/up"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - web
      - internal
    labels:
      # Traefik routes WebSocket traffic
      - "traefik.enable=true"
      - "traefik.http.routers.uniges-ws.rule=Host(`titulacion.carlosgardea.com`) && PathPrefix(`/app`)"
      - "traefik.http.routers.uniges-ws.entrypoints=websecure"
      - "traefik.http.routers.uniges-ws.tls=true"
      - "traefik.http.routers.uniges-ws.tls.certresolver=letsencrypt"
      - "traefik.http.services.uniges-ws.loadbalancer.server.port=8080"
    deploy:
      resources:
        limits:
          memory: 128M

  # --------------------------------------------------------------------------
  # Queue Worker (Laravel Horizon via Valkey)
  # --------------------------------------------------------------------------
  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: omnibus-uniges-queue
    restart: unless-stopped
    command: php artisan horizon
    env_file: .env
    volumes:
      - app-storage:/var/www/html/storage/app
      - app-logs:/var/www/html/storage/logs
    depends_on:
      app:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 256M

  # --------------------------------------------------------------------------
  # Task Scheduler (Laravel Schedule — includes demo:cleanup every 15 min)
  # --------------------------------------------------------------------------
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: omnibus-uniges-scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    env_file: .env
    volumes:
      - app-storage:/var/www/html/storage/app
      - app-logs:/var/www/html/storage/logs
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 128M

# ==============================================================================
# Volumes (Persistent Data)
# ==============================================================================
volumes:
  pgdata:
    driver: local
    name: omnibus-uniges-pgdata
  valkeydata:
    driver: local
    name: omnibus-uniges-valkeydata
  app-storage:
    driver: local
    name: omnibus-uniges-storage
  app-logs:
    driver: local
    name: omnibus-uniges-logs

# ==============================================================================
# Networks
# ==============================================================================
networks:
  # Traefik-exposed network (app + reverb containers)
  web:
    external: true
    name: web

  # Internal services communication
  internal:
    driver: bridge
    name: omnibus-uniges-internal

  # Shared PostgreSQL network (cross-project access if needed)
  global_data_private:
    external: true
    name: global_data_private

# ==============================================================================
# Secrets (Docker Secrets from files)
# ==============================================================================
secrets:
  db_password:
    file: ./secrets/db_password.txt
